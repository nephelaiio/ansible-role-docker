---
- name: Configure package repositories
  when: docker_repo_manage
  tags: install
  block:
    - name: Configure apt repository
      when: ansible_facts.os_family == "Debian"
      block:
        - name: Install Debian package helpers
          ansible.builtin.apt:
            name:
              - apt-transport-https
              - ca-certificates
              - python3-docker
              - python3-debian
              - python3-pip
              - curl

        - name: Remove legacy apt repository
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/docker.list
            state: absent

        - name: Create apt keyring directory
          ansible.builtin.file:
            path: "{{ docker_deb_repo.key_path | dirname }}"
            state: directory
            mode: "u=rwx,go=rx"
          when: docker_repo_state != 'absent'

        - name: Install apt signing key
          ansible.builtin.get_url:
            url: "{{ docker_deb_repo.key_url }}"
            dest: "{{ docker_deb_repo.key_path }}"
            mode: "u=rw,go=r"
          when: docker_repo_state != 'absent'

        - name: Manage apt repository
          ansible.builtin.deb822_repository:
            name: docker
            types: deb
            uris: "{{ docker_deb_repo.uris }}"
            suites: "{{ docker_deb_repo.suites }}"
            components: "{{ docker_deb_repo.components }}"
            signed_by: "{{ docker_deb_repo.key_path }}"
            state: "{{ docker_repo_state }}"

        - name: Remove apt signing key
          ansible.builtin.file:
            path: "{{ docker_deb_repo.key_path }}"
            state: absent
          when: docker_repo_state == 'absent'

        - name: Update apt package cache
          ansible.builtin.apt:
            update_cache: true

    - name: Configure yum repository
      when: ansible_facts.os_family == "RedHat"
      block:
        - name: Install epel repository
          ansible.builtin.package:
            name: epel-release

        - name: Install RedHat package helpers
          ansible.builtin.package:
            name:
              - python3-pip
              - python3-docker
              - python3-debian

        - name: Manage yum repository
          ansible.builtin.get_url:
            url: "{{ docker_rpm_repo.url }}"
            dest: /etc/yum.repos.d/docker.repo
            mode: "u=rw,go=r"
          when: docker_repo_state != 'absent'

        - name: Remove yum repository
          ansible.builtin.file:
            dest: /etc/yum.repos.d/docker.repo
            state: absent
          when: docker_repo_state == 'absent'
