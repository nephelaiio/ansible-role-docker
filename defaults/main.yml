---
docker_repo_manage: "{{ docker_packages_state != 'absent' }}"
docker_repo_state: present
docker_repo_deb_url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
docker_repo_deb_key: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
docker_repo_rpm_url: https://download.docker.com/linux/centos/docker-ce.repo
docker_repo_rpm_key: https://yum.dockerproject.org/gpg

docker_deb_repo:
  uris: "{{ docker_repo_deb_url }}"
  suites: "{{ ansible_facts.distribution_release | lower }}"
  components: stable
  key_url: "{{ docker_repo_deb_key }}"
  key_path: /etc/apt/keyrings/docker.asc
docker_rpm_repo:
  url: "{{ docker_repo_rpm_url }}"
  gpgkey: "{{ docker_repo_rpm_key }}"

docker_packages:
  - docker-ce
  - docker-ce-cli
docker_packages_state: present
docker_configuration_template: mountflags.conf.j2
docker_configuration_file: /etc/systemd/system/docker.service.d/mountflags.conf
docker_configuration_path: "{{ docker_configuration_file | dirname }}"
docker_service_name: docker
docker_service_state: started
docker_service_enabled: true
docker_service_manage: "{{ docker_packages_state != 'absent' }}"
docker_group: docker
docker_user_manage: true
docker_group_manage: true
docker_user: "{{ lookup('env', 'USER') }}"
docker_conf_file: /etc/docker/daemon.json
docker_conf_manage: false
docker_conf_mirror: []
docker_conf:
  log-driver: "json-file"
  log-opts:
    max-size: "10m"
    max-file: "3"
